version: '3'
services:
  mongo:
    image: mongo
    restart: always
    volumes:
      - mongo-data:/data/db
  server:
    build: ./server
    env_file: ./server/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongo
  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - server
volumes:
  mongo-data:
